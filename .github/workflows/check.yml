name: Developer contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up pinned development formatters
        shell: pwsh
        run: python -B scripts/style_setup.py --tool-root "$env:RUNNER_TEMP/rgm-style-tools"
      - name: Test generic Python contracts
        shell: pwsh
        env:
          RGM_STYLE_TOOLS: ${{ runner.temp }}/rgm-style-tools
        run: python -B -m unittest discover -s scripts/tests
      - name: Check developer source style
        shell: pwsh
        env:
          RGM_STYLE_TOOLS: ${{ runner.temp }}/rgm-style-tools
        run: python -B scripts/style.py check --root "$env:GITHUB_WORKSPACE"
      - name: Test JVM convention
        shell: pwsh
        run: '& "$env:JAVA_HOME/bin/java${{ runner.os == ''Windows'' && ''.exe'' || '''' }}" -classpath "$env:GITHUB_WORKSPACE/gradle-plugins/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain -p gradle-plugins test --no-daemon --console=plain'
